<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <g fill="none" stroke="#000" stroke-linecap="round" stroke-linejoin="round" stroke-width="6">
    <!-- Building outline -->
    <rect x="40" y="50" width="80" height="140" rx="3"/>
    <!-- Roof/top -->
    <path d="M35,50 L80,15 L125,50"/>
    <!-- Windows row 1 -->
    <rect x="55" y="70" width="20" height="20" rx="2"/>
    <rect x="85" y="70" width="20" height="20" rx="2"/>
    <!-- Windows row 2 -->
    <rect x="55" y="105" width="20" height="20" rx="2"/>
    <rect x="85" y="105" width="20" height="20" rx="2"/>
    <!-- Door -->
    <rect x="65" y="150" width="30" height="40" rx="2"/>
    <!-- HVAC unit on roof -->
    <rect x="130" y="30" width="45" height="35" rx="3"/>
    <line x1="140" y1="30" x2="140" y2="20"/>
    <line x1="165" y1="30" x2="165" y2="20"/>
    <!-- Air flow lines -->
    <path d="M152,65 C152,80 145,85 145,95"/>
    <path d="M152,65 C152,80 160,85 160,95"/>
    <!-- Clock/years badge -->
    <circle cx="152" cy="150" r="30"/>
    <polyline points="152,130 152,150 167,155"/>
  </g>
</svg>
